; Stranded II shared engine development defaults
; fps: 0 (unlimited), 60, 120 or 144. Command line: -fps 120
fps=144
; display: borderless or windowed. Command line: -borderless or -win
display=borderless
; desktop: fit primary monitor (render limit 2048 per axis); custom: dimensions below
resolution=desktop
render_width=1280
render_height=720
; Optional local timing/focus log: core/modern.log
diagnostics=0

language=en

; Quality-of-life options (Extended defaults) (1 = enabled, 0 = disabled).
qol_recipes=1
qol_storage=1
qol_loot_autoclose=1
qol_autosort=1
qol_hold_build=1

; Optional renderer enhancements (0 = original, 1 = enabled).
render_water=1
render_lighting=1
render_shadows=0
render_atmosphere=1
; Scene AA: 0 = off, 1 = FXAA, 4 = MSAA 4x. Text/HUD remain unfiltered.
render_antialias=1

; Stranded II shared engine development defaults
; fps: 60, 120 or 144. Command line: -fps 120
fps=144
; display: borderless or windowed. Command line: -borderless or -win
display=borderless
; desktop: fit primary monitor (render limit 2048 per axis); custom: dimensions below
resolution=desktop
render_width=1280
render_height=720
; Optional local timing/focus log: core/modern.log
diagnostics=0

language=en

; Optional quality-of-life features (1 = enabled, 0 = disabled).
qol_recipes=0
qol_storage=0
qol_loot_autoclose=0
qol_autosort=0
qol_hold_build=0

name: Windows build and release

on:
  workflow_dispatch:
    inputs:
      # Extended is for local development; edition selection is disabled.
      # edition:
      #   description: Edition to publish
      #   type: choice
      #   options: [classic, extended]
      #   default: classic
      publish:
        description: Publish Stranded II from main or dev
        type: boolean
        default: false
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && inputs.publish) && 'release' || github.ref }}
  queue: max
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    # Extended CI is paused. Restore edition routing and artifact names
    # together with this matrix when public Extended builds resume.
    # strategy:
    #   fail-fast: false
    #   matrix:
    #     edition: [classic, extended]
    # env:
    #   EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install preparation tools
        run: python -m pip install -r requirements.txt

      - name: Test packaging and release recovery
        run: python -X utf8 -m unittest discover -s tests -p test_ci*.py

      - name: Select release or preview version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHANNEL: ${{ github.ref_name }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          if ($env:PUBLISH_RELEASE -eq 'true') {
            python -X utf8 scripts/ci.py version --channel "$env:RELEASE_CHANNEL" --repo "$env:GH_REPO"
          } else {
            python -X utf8 scripts/ci.py version
          }
          if ($LASTEXITCODE -ne 0) { throw 'Version selection failed' }

      - name: Store selected version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: version-context
          path: build/ci/version.json
          overwrite: true
          if-no-files-found: error
          retention-days: 14

      - name: Read dependency pin
        id: pin
        run: python -X utf8 scripts/ci.py config --github-output "$env:GITHUB_OUTPUT"

      - name: Cache pinned dependency archive
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/ci/downloads
          key: ci-deps-${{ steps.pin.outputs.sha256 }}

      - name: Download dependencies from GitHub Release
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          DEPENDENCY_RELEASE: ${{ steps.pin.outputs.release }}
          DEPENDENCY_ASSET: ${{ steps.pin.outputs.asset }}
        run: |
          New-Item -ItemType Directory -Force -Path build/ci/downloads | Out-Null
          gh release download "$env:DEPENDENCY_RELEASE" --repo "$env:DEPENDENCY_REPOSITORY" --pattern "$env:DEPENDENCY_ASSET" --dir build/ci/downloads
          if ($LASTEXITCODE -ne 0) {
            throw 'Upload the pinned dependency ZIP to ci-deps-v1 first. See docs/development.md. No upstream download is attempted.'
          }

      - name: Validate and unpack dependencies
        id: deps
        env:
          DEPENDENCY_ASSET: ${{ steps.pin.outputs.asset }}
        run: python -X utf8 scripts/ci.py dependencies --archive "build/ci/downloads/$env:DEPENDENCY_ASSET" --github-output "$env:GITHUB_OUTPUT"

      - name: Prepare runtime resources
        env:
          GAME_INPUT: ${{ steps.deps.outputs.game }}
          BLITZ_INPUT: ${{ steps.deps.outputs.blitz }}
          FONT_INPUT: ${{ steps.deps.outputs.font }}
        run: python -X utf8 scripts/dev.py setup --game "$env:GAME_INPUT" --blitz "$env:BLITZ_INPUT" --font "$env:FONT_INPUT"

      - name: Compile Blitz3D and shared QOL input
        run: python -X utf8 scripts/dev.py build --version-info build/ci/version.json

      - name: Check resources and non-graphical runtime behavior
        run: python -X utf8 scripts/dev.py check

      - name: Package standalone game
        env:
          GAME_INPUT: ${{ steps.deps.outputs.game }}
        run: python -X utf8 scripts/ci.py package --game "$env:GAME_INPUT" --version-info build/ci/version.json

      - name: Upload game ZIP and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: StrandedII-windows
          path: build/release/*
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build and check reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-reports
          overwrite: true
          path: |
            build/setup-report.json
            build/build-report.json
            build/native/report.json
            build/check-*/**/*.json
            build/check-*/**/*.txt
          # Extended reports are disabled with its CI build:
          #   build/extended/setup-report.json
          #   build/extended/build-report.json
          #   build/extended/check-*/**/*.json
          #   build/extended/check-*/**/*.txt
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' ||
       github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: version-context
          path: build/ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: StrandedII-windows
          path: build/release

      - name: Publish immutable Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python -X utf8 scripts/ci.py release --repo "$env:GH_REPO"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

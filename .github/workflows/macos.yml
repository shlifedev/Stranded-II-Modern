name: macOS build

on:
  workflow_dispatch:
    inputs:
      notarize:
        description: Sign with Developer ID and notarize the test DMG (no Release publication)
        type: boolean
        default: true
  workflow_call:
    inputs:
      version_artifact:
        description: Version artifact from the release coordinator; empty for a local preview
        type: string
        default: ''
    secrets:
      APPLE_CERTIFICATE:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_PASSWORD:
        required: true
      APPLE_TEAM_ID:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: macos-preview-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    # Base game only. Extended CI and release routing remain disabled.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Download coordinated release version
        if: inputs.version_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.version_artifact }}
          path: build/ci

      - name: Install preparation tools
        run: |
          test "$(uname -m)" = arm64
          brew install cmake ninja ffmpeg zstd
          python -m pip install -r requirements.txt

      - name: Select preview version
        if: inputs.version_artifact == ''
        run: python scripts/ci.py version

      - name: Check platform and packaging boundaries
        run: |
          python -m unittest discover -s tests -p 'test_macos*.py'
          python -m unittest discover -s tests -p 'test_ci*.py'
          python -m unittest discover -s tests -p 'test_web_platform.py'

      - name: Read game dependency pin
        id: pin
        run: python scripts/ci.py config --github-output "$GITHUB_OUTPUT"

      - name: Cache verified game dependency archive
        id: game-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/ci/downloads
          key: ci-deps-${{ steps.pin.outputs.sha256 }}

      - name: Download pinned game dependency archive
        if: steps.game-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_REPOSITORY: ${{ github.repository }}
          DEPENDENCY_RELEASE: ${{ steps.pin.outputs.release }}
          DEPENDENCY_ASSET: ${{ steps.pin.outputs.asset }}
        run: |
          mkdir -p build/ci/downloads
          gh release download "$DEPENDENCY_RELEASE" --repo "$DEPENDENCY_REPOSITORY" \
            --pattern "$DEPENDENCY_ASSET" --dir build/ci/downloads

      - name: Validate and unpack game dependencies
        id: deps
        env:
          DEPENDENCY_ASSET: ${{ steps.pin.outputs.asset }}
        run: |
          python scripts/ci.py dependencies --archive "build/ci/downloads/$DEPENDENCY_ASSET" \
            --destination deps/ci-macos --github-output "$GITHUB_OUTPUT"

      - name: Identify build environment
        id: image
        run: |
          echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "sdk=$(xcrun --sdk macosx --show-sdk-version)" >> "$GITHUB_OUTPUT"

      - name: Cache pinned native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps/blitz3d
          key: macos-15-arm64-${{ steps.image.outputs.version }}-${{ steps.image.outputs.sdk }}-${{ hashFiles('config/macos-toolchain.json', 'config/blitz3d-toolchain.json', 'scripts/blitz3d_toolchain.py', 'scripts/macos_toolchain.py') }}

      - name: Prepare native resources and toolchain
        env:
          GAME_INPUT: ${{ steps.deps.outputs.game }}
          FONT_INPUT: ${{ steps.deps.outputs.font }}
        run: python scripts/dev.py setup --platform macos --game "$GAME_INPUT" --font "$FONT_INPUT"

      - name: Build native app
        run: python scripts/dev.py build --platform macos --version-info build/ci/version.json

      - name: Check native ABI and app package without graphics
        run: python scripts/dev.py check --platform macos --suite core

      - name: Package local preview DMG and verify installation copy
        if: inputs.version_artifact == '' && !inputs.notarize
        run: python scripts/macos_package.py

      - name: Sign, notarize, and verify app and DMG
        if: inputs.version_artifact != '' || inputs.notarize
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python scripts/macos_package.py --notarize

      - name: Upload native DMG and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: StrandedII-macos-arm64
          path: |
            build/macos/release/*.dmg
            build/macos/release/*.dmg.sha256
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload build and verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-reports
          overwrite: true
          path: |
            build/ci/version.json
            build/macos/setup-report.json
            build/macos/build-report.json
            build/macos/audio-report.json
            build/macos/verification*.json
            build/macos/verification-*/abi.log
            build/macos/verification-*/lifetime.log
            build/macos/distribution-report.json
            build/macos/notarization-*.json
          if-no-files-found: ignore
          retention-days: 14
